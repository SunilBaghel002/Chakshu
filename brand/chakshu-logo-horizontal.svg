<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <!-- Signal Amber Gradients -->
    <linearGradient id="hAmberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF9426"/>
      <stop offset="100%" stop-color="#D96B00"/>
    </linearGradient>

    <linearGradient id="hBlade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC875" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E07D10" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="hBlade2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA834" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9E5100" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="hIon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="720" height="180" rx="16" fill="#080C16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left: Logo Mark (scaled & centered around 90, 90) -->
  <g transform="translate(18, 18) scale(0.28125)">
    <!-- 512x512 scaled to 144x144 -->
    <!-- Outer Rings -->
    <circle cx="256" cy="256" r="236" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
    <circle cx="256" cy="256" r="212" fill="none" stroke="#1E293B" stroke-width="2"/>

    <!-- Orbital Trajectory -->
    <g transform="rotate(-28 256 256)">
      <ellipse cx="256" cy="256" rx="230" ry="100" fill="none" stroke="url(#hIon)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.65"/>
      <circle cx="486" cy="256" r="7" fill="#38BDF8"/>
      <circle cx="486" cy="256" r="3" fill="#FFFFFF"/>
      <line x1="474" y1="256" x2="498" y2="256" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <!-- Eye Contour -->
    <path d="M 80 256 C 136 150 376 150 432 256 C 376 362 136 362 80 256 Z" 
          fill="rgba(15, 23, 42, 0.5)" 
          stroke="#475569" 
          stroke-width="2" 
          stroke-dasharray="6 4" 
          opacity="0.8"/>

    <!-- Aperture Outer Ring -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="url(#hAmberCore)" stroke-width="3" opacity="0.9"/>

    <!-- 6 Blades -->
    <path d="M 256 108 C 304 108 368 152 384 200 L 320 224 C 308 190 274 168 256 168 Z" 
          fill="url(#hBlade1)" stroke="#FFB347" stroke-width="1.5"/>
    <path d="M 384 200 C 400 248 392 320 356 356 L 312 300 C 334 274 336 238 320 224 Z" 
          fill="url(#hBlade2)" stroke="#FF9426" stroke-width="1.5"/>
    <path d="M 356 356 C 320 392 248 404 200 384 L 224 320 C 258 334 294 326 312 300 Z" 
          fill="url(#hBlade1)" stroke="#FFB347" stroke-width="1.5"/>
    <path d="M 200 384 C 152 368 108 304 108 256 L 168 256 C 168 290 198 316 224 320 Z" 
          fill="url(#hBlade2)" stroke="#FF9426" stroke-width="1.5"/>
    <path d="M 108 256 C 108 200 152 144 200 120 L 236 180 C 204 196 180 228 168 256 Z" 
          fill="url(#hBlade1)" stroke="#FFB347" stroke-width="1.5"/>
    <path d="M 200 120 C 248 100 320 108 356 144 L 300 188 C 274 168 248 168 236 180 Z" 
          fill="url(#hBlade2)" stroke="#FF9426" stroke-width="1.5"/>

    <!-- Inner Chamber -->
    <circle cx="256" cy="256" r="76" fill="#070A12" stroke="#FF9426" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="64" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.75"/>

    <!-- Reticle -->
    <g stroke="#FF9426" stroke-width="2" opacity="0.95">
      <line x1="256" y1="184" x2="256" y2="216"/>
      <line x1="256" y1="296" x2="256" y2="328"/>
      <line x1="184" y1="256" x2="216" y2="256"/>
      <line x1="296" y1="256" x2="328" y2="256"/>
    </g>

    <!-- Pupil -->
    <circle cx="256" cy="256" r="34" fill="url(#hAmberCore)" filter="url(#hGlow)"/>
    <circle cx="256" cy="256" r="18" fill="#080C16"/>
    <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Typography Right Lockup -->
  <g transform="translate(186, 0)">
    <!-- Primary Devanagari & Latin Name -->
    <text x="0" y="74" fill="#FF9426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="2">
      चक्षु
    </text>
    <text x="96" y="74" fill="#FFFFFF" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="34" font-weight="700" letter-spacing="4">
      CHAKSHU
    </text>

    <!-- Subtitle / Motto -->
    <text x="0" y="112" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="13" font-weight="600" letter-spacing="3">
      SOVEREIGN EARTH OBSERVATION INTELLIGENCE
    </text>

    <!-- Tagline & SIH Attribution -->
    <text x="0" y="142" fill="#F0B45F" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="1.5">
      FROM ORBIT TO EVIDENCE · SIH 2026 (MoD · ISRO/SAC)
    </text>
  </g>
</svg>
