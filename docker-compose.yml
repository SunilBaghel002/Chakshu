services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: chakshu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chakshu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chakshu}
      POSTGRES_DB: ${POSTGRES_DB:-chakshu}
    ports:
      - "5432:5432"
    volumes:
      - chakshu_pgdata:/var/lib/postgresql/data
      - ./backend/app/db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  chakshu_pgdata:
