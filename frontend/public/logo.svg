<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Subtle coordinate crosshairs -->
  <path d="M50 8 V20 M50 80 V92 M8 50 H20 M80 50 H92" stroke="#4DA3FF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Orbital Ellipse / Aperture Geometry -->
  <ellipse cx="50" cy="50" rx="38" ry="22" stroke="#4DA3FF" stroke-width="2.5" transform="rotate(-25 50 50)"/>
  <!-- Concentric Radar / Geodetic Ring -->
  <circle cx="50" cy="50" r="14" stroke="#7CC4FF" stroke-width="2.2" stroke-dasharray="3 3"/>
  <!-- Central Deterministic Sensor Point / Iris Core -->
  <circle cx="50" cy="50" r="5" fill="#4DA3FF"/>
  <!-- Subtly placed satellite node on orbit -->
  <circle cx="76" cy="38" r="3" fill="#FFFFFF"/>
</svg>
