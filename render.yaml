services:
  - type: web
    name: chakshu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: prod
      - key: OFFLINE
        value: "0"
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_ENABLED
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@chakshu.internal
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERVER_SECRET
        value: dev-secret-key-chakshu-2026
